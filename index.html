<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Today's Deal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 12px 35px;
      background:
        radial-gradient(circle at top, #193300 0%, #080d05 35%, #000000 75%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: auto;
    }

    .logo {
      margin: 5px 0;
      color: #78ff00;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow:
        0 0 8px #54ff00,
        0 0 20px #32a800;
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 30px;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #cccccc;
      font-size: 16px;
    }

    .promo-box {
      padding: 7px;
      border: 2px solid #67ff00;
      border-radius: 20px;
      background: #080808;
      box-shadow:
        0 0 12px rgba(103, 255, 0, 0.8),
        0 0 30px rgba(103, 255, 0, 0.35);
    }

    #promo {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
    }

    .footer {
      margin-top: 25px;
      color: #bbbbbb;
      font-size: 15px;
      line-height: 1.5;
    }

    .footer strong {
      color: #78ff00;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">⚡</div>

    <h1>TODAY'S DEAL</h1>

    <p class="subtitle">
      Tap your NFC keychain anytime to see the latest promotion.
    </p>

    <div class="promo-box">
      <img id="promo" src="promo.jpg" alt="Today's promotion">
    </div>

    <div class="footer">
      <strong>New deals regularly</strong><br>
      Tap again soon to see what's new!
    </div>

  </main>

  <script>
    /*
      Adds a unique number to the image address so the phone
      displays the newest promotion instead of an older cached image.
    */
    document.getElementById("promo").src =
      "promo.jpg?v=" + new Date().getTime();
  </script>

</body>
</html>
