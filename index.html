<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Promoción del Día</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    padding:20px;
    background:radial-gradient(circle at top,#193300 0%,#080d05 35%,#000 80%);
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    text-align:center;
}

.container{
    max-width:750px;
    margin:auto;
}

.logo{
    font-size:42px;
    color:#6aff00;
    text-shadow:
        0 0 10px #6aff00,
        0 0 25px #3cff00;
}

h1{
    margin:10px 0;
    font-size:30px;
}

.subtitle{
    color:#d0d0d0;
    margin-bottom:25px;
}

.promo-box{

    padding:8px;
    border:2px solid #6aff00;
    border-radius:18px;

    background:#111;

    box-shadow:
        0 0 15px rgba(106,255,0,.8),
        0 0 30px rgba(106,255,0,.35);

}

#promo{
    width:100%;
    border-radius:12px;
    display:block;
}

.footer{
    margin-top:25px;
    color:#bfbfbf;
    line-height:1.5;
}

.footer strong{
    color:#6aff00;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">⚡</div>

<h1>🔥 PROMOCIÓN DEL DÍA 🔥</h1>

<p class="subtitle">
Acerca tu teléfono al llavero NFC para ver la promoción del día.
</p>

<div class="promo-box">

<img id="promo" src="" alt="Promoción">

</div>

<div class="footer">

<strong>¡Nuevas promociones regularmente!</strong>

<br>

¡Vuelve a escanear pronto!

</div>

</div>

<script>

/* =====================================================
   SOLO CAMBIA ESTA LÍNEA
===================================================== */

const promocion = "promo3.jpg";

/* ===================================================== */

document.getElementById("promo").src =
promocion + "?v=" + new Date().getTime();

</script>

</body>
</html>
